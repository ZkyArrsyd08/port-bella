:root {

  --color-sandy: #FB9F4F;
  --color-golden: #A78425;
}

html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: #F6FFE9;
  color: #A78425;
  font-family: 'Inter', system-ui, sans-serif;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
::selection { background: #E85A72; color: #FFFFFF; }

/* Scrollbar */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: #F6FFE9; }
::-webkit-scrollbar-thumb {
  background: #E85A72; border-radius: 999px; border: 2px solid #F6FFE9;
}
::-webkit-scrollbar-thumb:hover { background: #FB9F4F; }

/* Keyframes */
@keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
.animate-marquee { animation: marquee 30s linear infinite; }

@keyframes float {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-16px); }
}
.animate-float { animation: float 5s ease-in-out infinite; }

@keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.animate-spin-slow { animation: spin-slow 22s linear infinite; }

@keyframes blob {
  0%, 100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
  50% { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; }
}
.animate-blob { animation: blob 8s ease-in-out infinite; }

@keyframes wiggle {
  0%, 100% { transform: rotate(-3deg); }
  50% { transform: rotate(3deg); }
}
.animate-wiggle { animation: wiggle 2.5s ease-in-out infinite; }

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes ping {
  75%, 100% { transform: scale(2); opacity: 0; }
}
.animate-ping { animation: ping 1.5s cubic-bezier(0, 0, 0.2, 1) infinite; }

/* Reveal-on-scroll (replaces framer-motion) */
.reveal, .reveal-left, .reveal-right, .reveal-scale {
  opacity: 0;
  transition: opacity 0.7s cubic-bezier(0.22,1,0.36,1), transform 0.7s cubic-bezier(0.22,1,0.36,1);
}
.reveal { transform: translateY(28px); }
.reveal-left { transform: translateX(-32px); }
.reveal-right { transform: translateX(32px); }
.reveal-scale { transform: scale(0.94); }
.reveal.is-visible, .reveal-left.is-visible, .reveal-right.is-visible, .reveal-scale.is-visible {
  opacity: 1; transform: none;
}

.stagger > * {
  opacity: 0; transform: translateY(20px);
  transition: opacity 0.6s, transform 0.6s;
}
.stagger.is-visible > * { opacity: 1; transform: none; }
.stagger.is-visible > *:nth-child(1) { transition-delay: 0.05s; }
.stagger.is-visible > *:nth-child(2) { transition-delay: 0.15s; }
.stagger.is-visible > *:nth-child(3) { transition-delay: 0.25s; }
.stagger.is-visible > *:nth-child(4) { transition-delay: 0.35s; }
.stagger.is-visible > *:nth-child(5) { transition-delay: 0.45s; }
.stagger.is-visible > *:nth-child(6) { transition-delay: 0.55s; }

/* Underline draw */
.underline-draw {
  background-image: linear-gradient(currentColor, currentColor);
  background-position: 0% 100%;
  background-repeat: no-repeat;
  background-size: 0% 2px;
  transition: background-size 0.4s ease;
}
.underline-draw:hover { background-size: 100% 2px; }

/* Brutal card */
.brutal-card {
  border: 2px solid #A78425; border-radius: 24px;
  box-shadow: 6px 6px 0 0 #A78425; transition: all 0.25s ease;
}
.brutal-card:hover {
  transform: translate(-3px, -3px); box-shadow: 10px 10px 0 0 #E85A72;
}

/* Noise overlay */
.noise-bg::before {
  content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0.04;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  mix-blend-mode: multiply;
}

/* Text gradient */
.text-gradient-bella {
  background: linear-gradient(120deg, #E85A72 0%, #FB9F4F 50%, #A78425 100%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}

/* Nav pill */
.nav-pill {
  position: absolute; inset: 0; border-radius: 9999px;
  background: rgba(232, 90, 114, 0.1);
  z-index: -1;
}

/* Menu enter */
@keyframes menu-in {
  from { opacity: 0; max-height: 0; }
  to { opacity: 1; max-height: 500px; }
}
.menu-enter { animation: menu-in 0.3s ease forwards; }

/* Avatar pop-in — runs every time the img swaps (key change triggers remount) */
@keyframes avatar-pop {
  0%   { transform: scale(0.4) rotate(-8deg); opacity: 0; }
  55%  { transform: scale(1.18) rotate(3deg); opacity: 1; }
  75%  { transform: scale(0.94) rotate(-1deg); opacity: 1; }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}
.animate-avatar-pop {
  animation: avatar-pop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}

/* Toast enter */
@keyframes toast-in {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

const { useState, useEffect, useRef } = React;

/* ── Navbar ───────────────────────────────────────────── */
const NAV_ITEMS = [
  { label: "Home", href: "#home" },
  { label: "About", href: "#about" },
  { label: "Services", href: "#services" },
  { label: "Works", href: "#works" },
  { label: "Palette", href: "#palette" },
  { label: "Contact", href: "#contact" },
];

function Navbar() {
  const [scrolled, setScrolled] = useState(false);
  const [open, setOpen] = useState(false);
  const [active, setActive] = useState("Home");

  useEffect(() => {
    const onScroll = () => {
      setScrolled(window.scrollY > 32);
      const sections = NAV_ITEMS.map(i => i.href.replace("#", ""));
      const current = sections.find(id => {
        const el = document.getElementById(id);
        if (!el) return false;
        const rect = el.getBoundingClientRect();
        return rect.top <= 120 && rect.bottom >= 120;
      });
      if (current) {
        const item = NAV_ITEMS.find(i => i.href === `#${current}`);
        if (item) setActive(item.label);
      }
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  const handleNav = (href, label) => {
    setOpen(false);
    setActive(label);
    document.querySelector(href)?.scrollIntoView({ behavior: "smooth" });
  };

  const navStyle = scrolled
    ? { backgroundColor: "rgba(246,255,233,0.85)", backdropFilter: "blur(16px)",
        boxShadow: "0 4px 30px rgba(167,132,37,0.08)" }
    : { backgroundColor: "transparent" };

  return (
    <header className="fixed top-0 left-0 right-0 z-50 transition-all duration-300" style={navStyle}>
      <nav className="mx-auto max-w-7xl px-5 sm:px-8 lg:px-12 h-16 sm:h-20 flex items-center justify-between">
        <button onClick={() => handleNav("#home", "Home")} className="flex items-center gap-2 group" aria-label="Bella Home">
          <span className="relative inline-flex h-10 w-10 sm:h-11 sm:w-11 items-center justify-center rounded-full text-white font-bold text-lg shadow-lg"
            style={{ backgroundColor: "#E85A72", color: "#FFFFFF", fontFamily: "'Poppins', sans-serif" }}>
            B
            <Sparkles size={12} className="absolute -top-1 -right-1 animate-wiggle" style={{ color: "#FB9F4F" }} />
          </span>
          <span className="hidden sm:flex flex-col leading-tight">
            <span className="font-bold text-sm" style={{ color: "#A78425", fontFamily: "'Poppins', sans-serif" }}>Alysabella</span>
            <span className="text-base -mt-1" style={{ color: "#E85A72", fontFamily: "'Caveat', cursive" }}>Zahirazeta</span>
          </span>
        </button>

        <ul className="hidden md:flex items-center gap-1">
          {NAV_ITEMS.map(item => (
            <li key={item.label}>
              <button onClick={() => handleNav(item.href, item.label)}
                className={`relative px-4 py-2 rounded-full text-sm font-medium transition-colors ${active === item.label ? "text-[#E85A72]" : "text-[#A78425]/70 hover:text-[#E85A72]"}`}
                style={{ fontFamily: "'Poppins', sans-serif" }}>
                {active === item.label && <span className="nav-pill"></span>}
                {item.label}
              </button>
            </li>
          ))}
        </ul>

        <button onClick={() => handleNav("#contact", "Contact")}
          className="hidden md:inline-flex items-center gap-2 rounded-full px-5 py-2.5 text-sm font-semibold text-white shadow-lg transition-all hover:-translate-y-0.5"
          style={{ backgroundColor: "#E85A72", fontFamily: "'Poppins', sans-serif" }}>
          Let's Talk
        </button>

        <button onClick={() => setOpen(v => !v)}
          className="md:hidden inline-flex items-center justify-center h-10 w-10 rounded-full"
          style={{ backgroundColor: "rgba(232,90,114,0.1)", color: "#E85A72" }}
          aria-label="Toggle menu">
          {open ? <X size={20} /> : <Menu size={20} />}
        </button>
      </nav>

      {open && (
        <div className="md:hidden overflow-hidden menu-enter border-t" style={{ backgroundColor: "rgba(246,255,233,0.97)", backdropFilter: "blur(16px)", borderColor: "rgba(167,132,37,0.1)" }}>
          <ul className="px-5 py-4 flex flex-col gap-1">
            {NAV_ITEMS.map(item => (
              <li key={item.label}>
                <button onClick={() => handleNav(item.href, item.label)}
                  className={`block w-full text-left px-4 py-3 rounded-xl text-base font-medium transition-colors ${active === item.label ? "text-[#E85A72]" : "text-[#A78425] hover:bg-[#CDEF76]/40"}`}
                  style={{ backgroundColor: active === item.label ? "rgba(232,90,114,0.1)" : "transparent", fontFamily: "'Poppins', sans-serif" }}>
                  {item.label}
                </button>
              </li>
            ))}
            <li>
              <button onClick={() => handleNav("#contact", "Contact")}
                className="mt-2 w-full rounded-xl px-4 py-3 text-base font-semibold text-white"
                style={{ backgroundColor: "#E85A72", fontFamily: "'Poppins', sans-serif" }}>
                Let's Talk
              </button>
            </li>
          </ul>
        </div>
      )}
    </header>
  );
}

const AVATAR_FILES = window.__AVATAR_FILES__;  // ["bella-1-wink.png", "bella-2-smile.png", "bella-3-calm.png"]

function CyclingAvatar() {
  const [index, setIndex] = useState(0);
  useEffect(() => {
    const id = setInterval(() => {
      setIndex(i => (i + 1) % AVATAR_FILES.length);
    }, 3000);  // 3-second cycle
    return () => clearInterval(id);
  }, []);

  const current = AVATAR_FILES[index];

  return (
    <div className="relative w-full h-full rounded-full overflow-hidden flex items-center justify-center">
      {/* Placeholder — visible when the photo file is missing */}
      <div className="absolute inset-0 flex flex-col items-center justify-center p-4 text-center pointer-events-none">

        </p>
        <p className="text-[10px]" style={{ color: "rgba(167,132,37,0.7)", fontFamily: "'Space Grotesk', monospace" }}>
          
        </p>
      </div>
      {/* Avatar photo — background-image div so missing file shows no broken icon, just the placeholder */}
      <div
        key={index}
        role="img"
        aria-label={`Bella avatar — frame ${index + 1}`}
        className="absolute inset-0 w-full h-full animate-avatar-pop"
        style={{
          backgroundImage: "url(\"" + current + "\")",
          backgroundSize: "cover",
          backgroundPosition: "center",
          backgroundRepeat: "no-repeat",
        }}
      />
    </div>
  );
}

        return (
          <div key={i} className="absolute h-1 w-1 rounded-full" style={{
            left: `${(seed * 1.3) % 100}%`, top: `${(seed * 1.7) % 100}%`,

function PaletteCard({ color, index }) {
  const [copied, setCopied] = useState(false);
  const onCopy = () => {
    try { navigator.clipboard?.writeText(color.hex); } catch {}
    setCopied(true);
    setTimeout(() => setCopied(false), 1400);
  };
  return (
    <div className="reveal group relative rounded-3xl overflow-hidden"
      style={{ backgroundColor: "#FFFFFF", border: "2px solid rgba(167,132,37,0.15)" }}>
      <button onClick={onCopy} className="relative w-full flex flex-col p-4 transition-all" style={{ aspectRatio: "5 / 4", backgroundColor: color.bg, color: color.fg }}
        aria-label={`Copy ${color.hex}`}>
        <div className="flex items-start justify-between">
          <span className="text-[10px] sm:text-xs font-bold uppercase tracking-widest opacity-70" style={{ fontFamily: "'Poppins', sans-serif" }}>0{index + 1}</span>
          <span className="inline-flex h-7 w-7 items-center justify-center rounded-full transition-all group-hover:scale-110" style={{ backgroundColor: "rgba(255,255,255,0.3)", backdropFilter: "blur(8px)" }}>

        </div>
        <div className="mt-auto">
          <p className="text-base sm:text-lg font-black leading-tight" style={{ fontFamily: "'Poppins', sans-serif" }}>{color.name}</p>
          <p className="text-xs sm:text-sm font-semibold opacity-80" style={{ fontFamily: "'Space Grotesk', monospace" }}>{color.hex}</p>
        </div>
        {copied && (
          <span className="absolute top-2 right-2 rounded-full px-2 py-1 text-[10px] font-bold text-white" style={{ backgroundColor: "rgba(0,0,0,0.7)", fontFamily: "'Poppins', sans-serif" }}>Copied!</span>

      <div className="p-4">
        <p className="text-[10px] uppercase tracking-widest mb-1" style={{ color: "rgba(167,132,37,0.5)", fontFamily: "'Poppins', sans-serif" }}>Role</p>

/* ── Render & set up IntersectionObserver ───────────── */
// AVATAR_FRAMES is already defined above as window.__AVATAR_URIS__

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

// Wait for next paint so React-rendered nodes exist
requestAnimationFrame(() => {
  requestAnimationFrame(() => {
    const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add("is-visible");
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1, rootMargin: "0px 0px -60px 0px" });
    document.querySelectorAll(".reveal, .reveal-left, .reveal-right, .reveal-scale, .stagger").forEach(el => io.observe(el));
  });
});

  </script>

  <!-- Loader: transform JSX with classic runtime (React.createElement, no ESM imports) and inject as a real <script> -->
  <script>
    (function () {
      function run() {
        var src = document.getElementById('app-jsx').textContent;
        try {
          var out = Babel.transform(src, {
            presets: [['react', { runtime: 'classic' }]],
          }).code;
          var s = document.createElement('script');
          s.textContent = out;
          document.body.appendChild(s);
        } catch (e) {
          console.error('Babel transform failed:', e);
          document.getElementById('root').innerHTML =
            '<div style="padding:32px;font-family:sans-serif;color:#A78425;background:#F6FFE9;min-height:100vh">' +
            '<h1>Build error</h1><pre style="white-space:pre-wrap">' + (e.message || e) + '</pre></div>';
        }
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', run);
      } else {
        run();
      }
    })();
  </script>
